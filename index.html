<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miles Morales: Brooklyn Nights</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060f; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }
  canvas { display: block; cursor: crosshair; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
'use strict';

// ============================================================
//  MILES MORALES: BROOKLYN NIGHTS  —  a fan-made web-swinging game
//  Everything (art, sound, physics) is generated in code.
// ============================================================

// ---------- Utilities ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const sign = v => v < 0 ? -1 : 1;
const TAU = Math.PI * 2;
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

// ---------- Canvas ----------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1, VS = 1, VW = 0, VH = 0;

// ---------- Touch controls (iPad / phone) ----------
const TOUCH_DEVICE = (navigator.maxTouchPoints || 0) > 0 || 'ontouchstart' in window;
const touch = { ui: TOUCH_DEVICE, stick: null, web: null, held: {}, btns: [], hintT: 12 };
function layoutButtons() {
  const r = clamp(Math.min(W, H) * 0.07, 28, 52);
  const m = r * 0.6, bx = W - m - r * 1.2, by = H - m - r * 1.2;
  touch.btns = [
    { key: 'KeyW', label: 'JUMP', x: bx, y: by, r: r * 1.2, color: '#ffffff' },
    { key: 'KeyJ', label: 'PUNCH', x: bx - r * 2.9, y: by + r * 0.2, r, color: '#ff4d5a' },
    { key: 'KeyK', label: 'VENOM', x: bx - r * 2.3, y: by - r * 2.4, r, color: '#ffd23f' },
    { key: 'KeyL', label: 'CAMO', x: bx + r * 0.2, y: by - r * 2.9, r, color: '#9fe8ff' },
  ];
}
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  VS = clamp(Math.min(W / 1280, H / 720), 0.55, 1.35);
  VW = W / VS; VH = H / VS;
  layoutButtons();
}
window.addEventListener('resize', resize);
resize();

// ---------- World constants ----------
const WORLD_W = 14000;
const GROUND_Y = 900;
const GRAVITY = 1900;
const MAX_ROPE = 460;
const MIN_ROPE = 120;
const SKY_LIMIT = -80; // webs can't anchor to empty sky above this (just over the tallest roof)
const CRIMES_TO_WIN = 8;

// ---------- Input ----------
const keys = {}, pressed = {};
const mouse = { x: 0, y: 0, down: false, used: false, lastMove: -1e9 };
window.addEventListener('keydown', e => {
  touch.ui = false;
  if (!keys[e.code]) pressed[e.code] = true;
  keys[e.code] = true;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.down = false; });
canvas.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.used = true; mouse.lastMove = performance.now(); });
canvas.addEventListener('mousedown', e => {
  AudioSys.ensure();
  if (e.button === 0) { mouse.down = true; pressed.Mouse = true; }
  if (e.button === 2) pressed.MouseR = true;
});
window.addEventListener('mouseup', e => { if (e.button === 0) mouse.down = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());
function touchPos(t) { const r = canvas.getBoundingClientRect(); return [t.clientX - r.left, t.clientY - r.top]; }
function hitBtn(x, y) { for (const b of touch.btns) if (Math.hypot(x - b.x, y - b.y) < b.r * 1.35) return b; return null; }
canvas.addEventListener('touchstart', e => {
  e.preventDefault(); AudioSys.ensure(); touch.ui = true;
  for (const t of e.changedTouches) {
    const [x, y] = touchPos(t);
    if (G.state !== 'play') { pressed.Mouse = true; continue; }
    const b = hitBtn(x, y);
    if (b) { pressed[b.key] = true; b.held = true; touch.held[t.identifier] = b; continue; }
    if (x < W * 0.4 && !touch.stick) { touch.stick = { id: t.identifier, ox: x, oy: y, x, y }; continue; }
    if (!touch.web) {
      touch.web = { id: t.identifier, x, y };
      mouse.x = x; mouse.y = y; mouse.used = true; mouse.lastMove = performance.now();
      mouse.down = true; pressed.Mouse = true;
    }
  }
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const [x, y] = touchPos(t);
    if (touch.stick && t.identifier === touch.stick.id) { touch.stick.x = x; touch.stick.y = y; }
    else if (touch.web && t.identifier === touch.web.id) { touch.web.x = x; touch.web.y = y; mouse.x = x; mouse.y = y; mouse.lastMove = performance.now(); }
  }
}, { passive: false });
function touchEnd(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (touch.stick && t.identifier === touch.stick.id) touch.stick = null;
    if (touch.web && t.identifier === touch.web.id) { touch.web = null; mouse.down = false; }
    const b = touch.held[t.identifier];
    if (b) { b.held = false; delete touch.held[t.identifier]; }
  }
}
canvas.addEventListener('touchend', touchEnd, { passive: false });
canvas.addEventListener('touchcancel', touchEnd, { passive: false });
function applyTouchInput() {
  if (!touch.ui) return;
  const s = touch.stick, dx = s ? s.x - s.ox : 0, dy = s ? s.y - s.oy : 0;
  keys.ArrowLeft = dx < -14; keys.ArrowRight = dx > 14;
  keys.ArrowUp = dy < -28; keys.ArrowDown = dy > 28;
}
const isDown = (...codes) => codes.some(c => keys[c]);
const wasPressed = (...codes) => codes.some(c => pressed[c]);

// ---------- Audio (synthesized) ----------
const AudioSys = (() => {
  let ac = null;
  function ensure() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
    if (ac && ac.state === 'suspended') ac.resume();
  }
  function tone({ f = 440, f2 = null, type = 'sine', dur = 0.1, vol = 0.2, attack = 0.005, delay = 0 }) {
    if (!ac) return;
    const t = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2 != null) o.frequency.exponentialRampToValueAtTime(Math.max(f2, 1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(dur = 0.1, vol = 0.15, hp = 1000) {
    if (!ac) return;
    const t = ac.currentTime, n = Math.floor(ac.sampleRate * dur);
    const buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = ac.createBufferSource(); s.buffer = buf;
    const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ac.createGain(); g.gain.value = vol;
    s.connect(f).connect(g).connect(ac.destination); s.start(t);
  }
  return {
    ensure,
    thwip() { tone({ f: 1000, f2: 250, type: 'square', dur: 0.09, vol: 0.07 }); noise(0.08, 0.07, 2500); },
    jump() { tone({ f: 280, f2: 620, type: 'triangle', dur: 0.12, vol: 0.09 }); },
    punch() { noise(0.07, 0.18, 600); tone({ f: 160, f2: 60, type: 'square', dur: 0.08, vol: 0.1 }); },
    hit() { tone({ f: 220, f2: 70, type: 'sawtooth', dur: 0.14, vol: 0.11 }); noise(0.1, 0.14, 300); },
    venom() { tone({ f: 1400, f2: 180, type: 'sawtooth', dur: 0.35, vol: 0.16 }); noise(0.3, 0.18, 1500); tone({ f: 70, f2: 35, type: 'sine', dur: 0.45, vol: 0.3 }); },
    camo() { tone({ f: 500, f2: 1600, type: 'sine', dur: 0.3, vol: 0.09 }); },
    uncamo() { tone({ f: 1600, f2: 500, type: 'sine', dur: 0.25, vol: 0.07 }); },
    hurt() { tone({ f: 420, f2: 90, type: 'square', dur: 0.2, vol: 0.13 }); },
    shot() { noise(0.06, 0.12, 800); tone({ f: 900, f2: 200, type: 'square', dur: 0.05, vol: 0.05 }); },
    ko() { tone({ f: 520, f2: 50, type: 'sawtooth', dur: 0.3, vol: 0.11 }); },
    crime() { tone({ f: 440, type: 'square', dur: 0.1, vol: 0.07 }); tone({ f: 660, type: 'square', dur: 0.18, vol: 0.07, delay: 0.12 }); },
    alert() { tone({ f: 330, f2: 330, type: 'square', dur: 0.08, vol: 0.05 }); tone({ f: 330, type: 'square', dur: 0.08, vol: 0.05, delay: 0.12 }); },
    sense() { tone({ f: 1800, f2: 2400, type: 'sine', dur: 0.12, vol: 0.05 }); },
    win() { [523, 659, 784, 1046].forEach((f, i) => tone({ f, type: 'triangle', dur: 0.35, vol: 0.14, delay: i * 0.14 })); },
    lose() { [392, 349, 311, 262].forEach((f, i) => tone({ f, type: 'sawtooth', dur: 0.4, vol: 0.1, delay: i * 0.2 })); },
  };
})();

// ---------- City generation ----------
const buildings = [];
const bgLayers = []; // parallax silhouettes
const stars = [];
const WIN_COLORS = ['rgba(255,214,130,0.85)', 'rgba(150,215,255,0.8)', 'rgba(255,170,200,0.8)'];
const SIGNS = ['BODEGA', 'PIZZA', '24 HR', 'BK', 'LAUNDRY', 'RECORDS', 'DELI', 'HOTEL', 'ARCADE', 'DINER'];
const SIGN_COLORS = ['#ff3b6b', '#3bffd0', '#ffd23f', '#8e6bff', '#ff7a3b'];

function genCity() {
  const r = rng(20250917);
  const palette = ['#1b2238', '#201a35', '#232a40', '#182030', '#2a2340', '#1c2a3a', '#26213c'];
  let x = -700;
  while (x < WORLD_W + 700) {
    const w = Math.floor(150 + r() * 240);
    const h = Math.floor(190 + r() * 560);
    const b = {
      x, y: GROUND_Y - h, w, h,
      color: palette[Math.floor(r() * palette.length)],
      wins: [[], [], []],
      tower: r() < 0.22, antenna: r() < 0.3,
      sign: r() < 0.22 ? { text: SIGNS[Math.floor(r() * SIGNS.length)], color: SIGN_COLORS[Math.floor(r() * SIGN_COLORS.length)], y: 40 + Math.floor(r() * Math.max(10, h - 120)) } : null,
    };
    const cols = Math.floor((w - 24) / 22), rows = Math.floor((h - 30) / 26);
    for (let c = 0; c < cols; c++) for (let rr = 0; rr < rows; rr++) {
      const v = r();
      if (v < 0.34) b.wins[v < 0.07 ? 2 : v < 0.17 ? 1 : 0].push(c, rr);
    }
    buildings.push(b);
    x += w + (r() < 0.32 ? Math.floor(80 + r() * 170) : 0);
  }
  // Parallax layers: far (0.15) and mid (0.4)
  const layerDefs = [{ f: 0.15, color: '#0c1024', minH: 120, maxH: 420, seed: 11 }, { f: 0.4, color: '#121832', minH: 100, maxH: 520, seed: 23 }];
  for (const L of layerDefs) {
    const rr = rng(L.seed), items = [];
    let bx = -600;
    const span = WORLD_W * L.f + 4000;
    while (bx < span) {
      const w = Math.floor(80 + rr() * 200), h = Math.floor(L.minH + rr() * (L.maxH - L.minH));
      const dots = [];
      const nd = Math.floor(rr() * 12);
      for (let i = 0; i < nd; i++) dots.push(rr() * w, rr() * h);
      items.push({ x: bx, w, h, dots, spire: rr() < 0.12 });
      bx += w + Math.floor(rr() * 40);
    }
    bgLayers.push({ f: L.f, color: L.color, items });
  }
  const sr = rng(7);
  for (let i = 0; i < 160; i++) stars.push({ x: sr() * 4000, y: sr() * 700, s: 0.5 + sr() * 1.6, tw: sr() * TAU });
}
genCity();

function insideBuilding(x, y) {
  for (const b of buildings) {
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b;
  }
  return null;
}
function buildingBelow(x, y) {
  let best = null;
  for (const b of buildings) if (x >= b.x && x <= b.x + b.w && b.y >= y - 1 && (!best || b.y < best.y)) best = b;
  return best;
}

// ---------- Entities ----------
const player = {
  x: 0, y: 0, vx: 0, vy: 0, w: 26, h: 46, facing: 1,
  onGround: false, onWall: 0, coyote: 0, jumpsLeft: 1,
  swinging: false, anchor: null, ropeLen: 0, swingT: 0,
  hp: 100, maxHp: 100, venom: 50, venomT: 0,
  camo: false, camoT: 0, camoCd: 0,
  punchT: 0, punchCd: 0, punchId: 0, kickT: 0,
  invulnT: 0, lastHurt: -99, alive: true, deadT: 0, animT: 0,
  hand: [0, 0], senseT: 0, wallT: 0, landT: 0,
};
const cam = { x: 0, y: 0 };
const enemies = [], bullets = [], particles = [], texts = [], arcs = [];
const G = { state: 'title', time: 0, score: 0, combo: 0, comboT: 0, crimes: 0, crime: null, crimeSpawnT: 0, shake: 0, hintT: 16, best: 0, bestTime: 0, paused: false, flash: 0 };
try { G.best = +localStorage.getItem('mm_best') || 0; G.bestTime = +localStorage.getItem('mm_best_time') || 0; } catch (e) { }

function reset() {
  enemies.length = 0; bullets.length = 0; particles.length = 0; texts.length = 0; arcs.length = 0;
  Object.assign(G, { time: 0, score: 0, combo: 0, comboT: 0, crimes: 0, crime: null, crimeSpawnT: 1.2, shake: 0, paused: false, flash: 0 });
  touch.hintT = 12;
  // spawn on a tall, wide roof whose neighbour is attached and lower: a runway, not a pit
  const start = buildings.find((b, i) => { const n = buildings[i + 1]; return b.x > 300 && b.w >= 250 && b.h >= 380 && n && n.x === b.x + b.w && n.y >= b.y; }) || buildings[2];
  Object.assign(player, {
    x: start.x + start.w / 2, y: start.y - player.h / 2 - 1, vx: 0, vy: 0, facing: 1,
    hp: 100, venom: 50, camo: false, camoT: 0, camoCd: 0, swinging: false, anchor: null, alive: true,
    invulnT: 0, punchT: 0, punchCd: 0, jumpsLeft: 1, deadT: 0, lastHurt: -99, senseT: 0, onGround: true,
  });
  cam.x = clamp(player.x - VW / 2, 0, WORLD_W - VW);
  cam.y = player.y - VH * 0.6;
}

// ---------- Collision ----------
function collideBody(b) {
  b.onGround = false; b.onWall = 0;
  const hw = b.w / 2, hh = b.h / 2;
  if (b.y + hh > GROUND_Y) { b.y = GROUND_Y - hh; if (b.vy > 0) b.vy = 0; b.onGround = true; }
  for (const B of buildings) {
    if (b.x + hw <= B.x || b.x - hw >= B.x + B.w) continue;
    const l = b.x - hw, r = b.x + hw, t = b.y - hh, bt = b.y + hh;
    if (bt <= B.y || t >= B.y + B.h) continue;
    const pushL = r - B.x, pushR = B.x + B.w - l, pushU = bt - B.y, pushD = B.y + B.h - t;
    const m = Math.min(pushL, pushR, pushU, pushD);
    if (m === pushU) { b.y -= pushU; if (b.vy > 0) b.vy = 0; b.onGround = true; }
    else if (m === pushD) { b.y += pushD; if (b.vy < 0) b.vy = 0; }
    else if (m === pushL) { b.x -= pushL; if (b.vx > 0) b.vx = 0; b.onWall = 1; }
    else { b.x += pushR; if (b.vx < 0) b.vx = 0; b.onWall = -1; }
  }
  if (b.x < hw + 10) { b.x = hw + 10; if (b.vx < 0) b.vx = 0; }
  if (b.x > WORLD_W - hw - 10) { b.x = WORLD_W - hw - 10; if (b.vx > 0) b.vx = 0; }
  if (b.y < -900) { b.y = -900; if (b.vy < 0) b.vy = 0; }
}
function wallTouch(b) {
  const hw = b.w / 2, hh = b.h / 2;
  for (const B of buildings) {
    if (b.y + hh - 6 <= B.y || b.y - hh + 6 >= B.y + B.h) continue;
    if (Math.abs(b.x + hw - B.x) < 3) return 1;
    if (Math.abs(b.x - hw - (B.x + B.w)) < 3) return -1;
  }
  return 0;
}

// ---------- Web anchoring ----------
function findAnchor() {
  const p = player;
  let dx, dy;
  if (mouse.used && performance.now() - mouse.lastMove < 3500) {
    dx = (mouse.x / VS + cam.x) - p.x; dy = (mouse.y / VS + cam.y) - p.y;
    if (Math.hypot(dx, dy) < 30) { dx = p.facing * 0.6; dy = -1; }
  } else { dx = p.facing * 0.6; dy = -1; }
  const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
  if (dy > -0.15) { dy = -0.15; const d2 = Math.hypot(dx, dy); dx /= d2; dy /= d2; }
  // the ray stops at the sky ceiling, so high up you can only web onto buildings
  let reach = MAX_ROPE;
  if (p.y + dy * reach < SKY_LIMIT) reach = (SKY_LIMIT - p.y) / dy;
  for (let s = 100; s <= reach; s += 8) {
    const x = p.x + dx * s, y = p.y + dy * s;
    if (insideBuilding(x, y)) return { x, y, type: 'wall' };
  }
  if (reach < 150) return null;
  const x = p.x + dx * reach, y = p.y + dy * reach;
  if (y < GROUND_Y - 160) return { x, y, type: 'sky' };
  return null;
}

// ---------- Effects ----------
function burst(x, y, n, color, speed = 200, life = 0.5, size = 3, grav = 600) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, s = rand(speed * 0.3, speed);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, maxLife: life, color, size: rand(size * 0.6, size * 1.4), grav });
  }
}
function floatText(x, y, txt, color = '#fff', size = 18, life = 1.1) { texts.push({ x, y, txt, color, size, life, maxLife: life }); }
function shake(v) { G.shake = Math.max(G.shake, v); }

// ---------- Player ----------
function takeDamage(n, fromX) {
  const p = player;
  if (!p.alive || p.invulnT > 0) return;
  p.hp -= n; p.invulnT = 0.9; p.lastHurt = G.time;
  p.vx = (p.x < fromX ? -1 : 1) * 260; p.vy = Math.min(p.vy, -200);
  if (p.swinging) { p.swinging = false; p.anchor = null; }
  if (p.camo) { p.camo = false; p.camoCd = 8; AudioSys.uncamo(); }
  G.combo = 0;
  burst(p.x, p.y, 10, '#ff4d5a', 260, 0.5, 3);
  shake(8); AudioSys.hurt();
  if (p.hp <= 0) { p.hp = 0; p.alive = false; p.deadT = 0; AudioSys.lose(); }
}

function updatePlayer(dt) {
  const p = player;
  p.animT += dt;
  if (!p.alive) {
    p.vy += GRAVITY * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.98; collideBody(p);
    p.deadT += dt; if (p.deadT > 1.6) G.state = 'dead';
    return;
  }
  const left = isDown('KeyA', 'ArrowLeft'), right = isDown('KeyD', 'ArrowRight');
  const up = isDown('KeyW', 'ArrowUp'), down = isDown('KeyS', 'ArrowDown');
  const jumpPressed = wasPressed('KeyW', 'ArrowUp');
  const webPressed = wasPressed('Space', 'Mouse'), webHeld = isDown('Space') || mouse.down;
  const punchPressed = wasPressed('KeyJ', 'MouseR'), venomPressed = wasPressed('KeyK'), camoPressed = wasPressed('KeyL', 'ShiftLeft', 'ShiftRight');

  // timers
  p.invulnT = Math.max(0, p.invulnT - dt);
  p.punchT = Math.max(0, p.punchT - dt); p.punchCd = Math.max(0, p.punchCd - dt);
  p.venomT = Math.max(0, p.venomT - dt); p.senseT = Math.max(0, p.senseT - dt); p.landT = Math.max(0, p.landT - dt);
  p.camoCd = Math.max(0, p.camoCd - dt);
  if (p.camo) { p.camoT -= dt; if (p.camoT <= 0) { p.camo = false; p.camoCd = 12; AudioSys.uncamo(); floatText(p.x, p.y - 50, 'CAMO OFF', '#9fe8ff', 14); } }
  if (G.time - p.lastHurt > 5 && p.hp < p.maxHp) p.hp = Math.min(p.maxHp, p.hp + 7 * dt);
  p.venom = Math.min(100, p.venom + 2.5 * dt);

  // abilities
  if (camoPressed && !p.camo && p.camoCd <= 0) {
    p.camo = true; p.camoT = 6; AudioSys.camo();
    burst(p.x, p.y, 16, '#9fe8ff', 160, 0.6, 2, 0);
    floatText(p.x, p.y - 50, 'CAMOUFLAGE', '#9fe8ff', 14);
    for (const e of enemies) e.alerted = false;
  }
  if (venomPressed) {
    if (p.venom >= 50) {
      p.venom -= 50; p.venomT = 0.35; venomStrike();
    } else { floatText(p.x, p.y - 50, 'NOT ENOUGH VENOM', '#ffd23f', 13, 0.8); }
  }
  if (punchPressed && p.punchCd <= 0) {
    p.punchT = 0.18; p.punchCd = 0.3; p.punchId++;
    AudioSys.punch();
  }

  // web
  if (webPressed && !p.swinging) {
    const a = findAnchor();
    if (a) {
      p.swinging = true; p.anchor = a; p.swingT = 0;
      const d = Math.hypot(a.x - p.x, a.y - p.y);
      p.ropeLen = clamp(d * 0.97, MIN_ROPE, MAX_ROPE);
      p.onWall = 0; p.jumpsLeft = 1;
      // tug toward the anchor so a web fired from a standstill actually pulls you up
      const slow = Math.hypot(p.vx, p.vy) < 250;
      const tug = slow ? 340 : 160;
      p.vx += (a.x - p.x) / d * tug; p.vy += (a.y - p.y) / d * tug;
      if (p.onGround) p.vy = Math.min(p.vy, -300);
      AudioSys.thwip();
      burst(a.x, a.y, 5, '#ffffff', 90, 0.35, 2, 0);
    }
  }
  if (p.swinging && !webHeld) { p.swinging = false; p.anchor = null; p.jumpsLeft = 1; }

  const wall = !p.swinging ? wallTouch(p) : 0;
  const pushingWall = (wall > 0 && right) || (wall < 0 && left);
  const crawling = wall !== 0 && (pushingWall || (!p.onGround && (up || down)));

  if (p.swinging) {
    const a = p.anchor;
    p.swingT += dt;
    p.vy += GRAVITY * dt;
    if (left) p.vx -= 700 * dt;
    if (right) p.vx += 700 * dt;
    if (up) p.ropeLen = Math.max(MIN_ROPE, p.ropeLen - 160 * dt);
    if (down) p.ropeLen = Math.min(MAX_ROPE, p.ropeLen + 160 * dt);
    p.ropeLen = Math.max(MIN_ROPE, p.ropeLen - 25 * dt);
    p.x += p.vx * dt; p.y += p.vy * dt;
    const dx = p.x - a.x, dy = p.y - a.y, d = Math.hypot(dx, dy);
    if (d > p.ropeLen) {
      const nx = dx / d, ny = dy / d;
      p.x = a.x + nx * p.ropeLen; p.y = a.y + ny * p.ropeLen;
      const vn = p.vx * nx + p.vy * ny;
      if (vn > 0) { p.vx -= vn * nx; p.vy -= vn * ny; }
    }
    const drag = Math.pow(0.93, dt);
    p.vx *= drag; p.vy *= drag;
    const sp = Math.hypot(p.vx, p.vy);
    if (sp > 1500) { const k = 1500 / sp; p.vx *= k; p.vy *= k; }
    if (Math.abs(p.vx) > 20) p.facing = sign(p.vx);
    if (jumpPressed) { // launch off the web
      p.swinging = false; p.anchor = null;
      p.vy -= 320; p.vx += p.facing * 120; p.jumpsLeft = 1; AudioSys.jump();
    }
    collideBody(p);
    if (p.onGround && p.swinging && p.swingT > 0.15) { p.swinging = false; p.anchor = null; }
  } else if (crawling) {
    p.facing = wall; p.wallT += dt;
    p.vx = 0; p.vy = up ? -220 : down ? 220 : pushingWall ? -220 : 0;
    p.y += p.vy * dt; p.x += wall * 2 * dt; // hug the wall
    if (jumpPressed) { p.vx = -wall * 460; p.vy = -640; p.facing = -wall; p.jumpsLeft = 1; AudioSys.jump(); burst(p.x, p.y, 6, '#cfd8ff', 150, 0.3, 2); }
    collideBody(p);
    if (!wallTouch(p) && !p.onGround) { /* crawled off the top: pop onto the roof */ p.vy = -260; p.vx = wall * 180; }
    p.onWall = wall;
  } else {
    const accel = p.onGround ? 2800 : 1500, maxRun = 400;
    if (left) { p.vx -= accel * dt; p.facing = -1; }
    if (right) { p.vx += accel * dt; p.facing = 1; }
    if (!left && !right) p.vx *= Math.pow(p.onGround ? 0.0008 : 0.5, dt);
    const cap = p.onGround ? maxRun : 1000;
    if (Math.abs(p.vx) > cap) p.vx = sign(p.vx) * Math.max(cap, Math.abs(p.vx) - 900 * dt);
    p.vy += GRAVITY * dt; if (p.vy > 1500) p.vy = 1500;
    p.coyote = p.onGround ? 0.12 : Math.max(0, p.coyote - dt);
    if (jumpPressed) {
      if (p.onGround || p.coyote > 0) { p.vy = -720; p.coyote = 0; p.jumpsLeft = 1; AudioSys.jump(); burst(p.x, p.y + 20, 5, '#9aa3c7', 100, 0.3, 2); }
      else if (p.jumpsLeft > 0) { p.vy = -620; p.jumpsLeft--; AudioSys.jump(); burst(p.x, p.y + 10, 8, '#ffffff', 120, 0.3, 2, 0); }
    }
    const wasGround = p.onGround, prevVy = p.vy;
    p.x += p.vx * dt; p.y += p.vy * dt;
    collideBody(p);
    if (p.onGround) p.jumpsLeft = 1;
    if (p.onGround && !wasGround && prevVy > 600) { p.landT = 0.18; burst(p.x, p.y + 22, 8, '#9aa3c7', 160, 0.35, 2); if (prevVy > 1100) shake(4); }
  }

  // punch hits
  if (p.punchT > 0) {
    const hx = p.x + p.facing * 32, hy = p.y - 2;
    for (const e of enemies) {
      if (e.dead || e.hitId === p.punchId) continue;
      if (Math.abs(e.x - hx) < 36 && Math.abs(e.y - hy) < 40) {
        e.hitId = p.punchId;
        const stealth = p.camo;
        hitEnemy(e, stealth ? 3 : 1, p.facing * 300, -220, stealth ? 'STEALTH TAKEDOWN' : null);
        if (stealth) { p.camo = false; p.camoCd = 10; AudioSys.uncamo(); }
        p.venom = Math.min(100, p.venom + 12);
      }
    }
  }
}

function venomStrike() {
  const p = player;
  AudioSys.venom(); shake(14); G.flash = 0.25;
  burst(p.x, p.y, 40, '#ffe04a', 420, 0.6, 3, 300);
  burst(p.x, p.y, 20, '#ffffff', 300, 0.3, 2, 0);
  for (let i = 0; i < 6; i++) {
    const a = Math.random() * TAU; arcs.push({ x1: p.x, y1: p.y, x2: p.x + Math.cos(a) * rand(60, 140), y2: p.y + Math.sin(a) * rand(60, 140), life: 0.3, maxLife: 0.3 });
  }
  let hits = 0;
  for (const e of enemies) {
    if (e.dead) continue;
    const d = Math.hypot(e.x - p.x, e.y - p.y);
    if (d < 150) {
      arcs.push({ x1: p.x, y1: p.y, x2: e.x, y2: e.y, life: 0.35, maxLife: 0.35 });
      hitEnemy(e, 3, sign(e.x - p.x) * 420, -480, 'VENOM STRIKE', 1.4);
      hits++;
    }
  }
  for (let i = bullets.length - 1; i >= 0; i--) { const b = bullets[i]; if (Math.hypot(b.x - p.x, b.y - p.y) < 160) { burst(b.x, b.y, 4, '#ffe04a', 120, 0.3, 2, 0); bullets.splice(i, 1); } }
  if (p.camo) { p.camo = false; p.camoCd = 10; }
  if (hits >= 3) floatText(p.x, p.y - 70, 'SHOCKWAVE!', '#ffe04a', 22);
}

function hitEnemy(e, dmg, kx, ky, label, stun = 0.4) {
  e.hp -= dmg; e.vx = kx; e.vy = ky; e.stunT = Math.max(e.stunT, stun); e.atkT = 0; e.alerted = true; e.hurtT = 0.2;
  G.combo++; G.comboT = 2.2;
  const pts = (e.hp <= 0 ? 100 : 25) * Math.min(G.combo, 10);
  G.score += pts;
  burst(e.x, e.y - 10, 8, dmg >= 3 ? '#ffe04a' : '#ffffff', 220, 0.4, 2.5);
  AudioSys.hit(); shake(3);
  if (label) floatText(e.x, e.y - 60, label, dmg >= 3 ? '#ffe04a' : '#fff', 15);
  if (e.hp <= 0) {
    e.dead = true; e.deadT = 0; e.spinV = -sign(kx) * rand(4, 9); e.vy = Math.min(ky, -380); e.vx = kx * 1.2;
    floatText(e.x, e.y - 40, '+' + pts, '#ffd23f', 18);
    AudioSys.ko();
  } else floatText(e.x, e.y - 40, '+' + pts, '#fff', 13, 0.7);
}

// ---------- Enemies & crimes ----------
const SKINS = ['#f1c27d', '#c68642', '#8d5524', '#e0ac69', '#ffdbac', '#5c3a21'];
const HOODS = ['#3b7a57', '#7a3b6e', '#4a4a55', '#8a4b2a', '#2f4f8a', '#6b2e2e'];

function spawnCrime() {
  const p = player;
  const candidates = buildings.filter(b => b.w >= 180 && b.h >= 240 && b.x > 100 && b.x + b.w < WORLD_W - 100);
  let ahead = candidates.filter(b => b.x > p.x + 650 && b.x < p.x + 2300);
  if (ahead.length < 2) ahead = candidates.filter(b => b.x + b.w < p.x - 650 && b.x > p.x - 2300);
  if (ahead.length === 0) ahead = candidates.filter(b => Math.abs(b.x - p.x) > 500);
  const b = ahead[Math.floor(Math.random() * ahead.length)];
  const n = Math.min(3 + Math.floor(G.crimes / 2), 6);
  const list = [];
  for (let i = 0; i < n; i++) {
    const gunner = i > 0 && Math.random() < 0.3 + G.crimes * 0.05;
    const e = {
      x: b.x + 40 + (b.w - 80) * (i + 0.5) / n, y: b.y - 60, vx: 0, vy: 0, w: 24, h: 44, facing: Math.random() < 0.5 ? -1 : 1,
      type: gunner ? 'gunner' : 'thug', hp: gunner ? 2 : 3, bld: b, stunT: 0, hurtT: 0, atkT: 0, atkCd: 0, atkHit: false,
      fireCd: rand(0.8, 1.8), patrolT: rand(1, 3), dead: false, deadT: 0, spin: 0, spinV: 0, hitId: -1, animT: Math.random() * 10,
      skin: SKINS[Math.floor(Math.random() * SKINS.length)], col: HOODS[Math.floor(Math.random() * HOODS.length)], alerted: false, alertT: 0,
    };
    enemies.push(e); list.push(e);
    burst(e.x, e.y, 6, '#ff5a5a', 80, 0.5, 2, 0);
  }
  G.crime = { b, list, t: 0 };
  AudioSys.crime();
  floatText(p.x, p.y - 80, 'CRIME IN PROGRESS!', '#ff5a5a', 20, 1.6);
}

function updateEnemies(dt) {
  const p = player;
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.animT += dt;
    if (e.dead) {
      e.vy += GRAVITY * dt; e.x += e.vx * dt; e.y += e.vy * dt; e.spin += e.spinV * dt; e.deadT += dt;
      if (e.deadT > 2.5 || e.y > GROUND_Y + 300) enemies.splice(i, 1);
      continue;
    }
    e.stunT = Math.max(0, e.stunT - dt); e.hurtT = Math.max(0, e.hurtT - dt); e.atkCd = Math.max(0, e.atkCd - dt); e.alertT = Math.max(0, e.alertT - dt);
    e.vy += GRAVITY * dt;
    const dx = p.x - e.x, dy = p.y - e.y, dist = Math.hypot(dx, dy);
    const sees = p.alive && !p.camo && dist < (e.alerted ? 700 : 420) && Math.abs(dy) < 260;
    if (sees && !e.alerted) { e.alerted = true; e.alertT = 0.8; AudioSys.alert(); }
    if (e.stunT > 0) {
      e.vx *= Math.pow(0.02, dt);
    } else if (e.type === 'thug') {
      if (sees) {
        e.facing = sign(dx);
        if (Math.abs(dx) > 34 || Math.abs(dy) > 70) e.vx = lerp(e.vx, e.facing * 170, 1 - Math.pow(0.001, dt));
        else { e.vx *= 0.5; if (e.atkCd <= 0 && e.atkT <= 0) { e.atkT = 0.5; e.atkHit = false; e.atkCd = 1.3; } }
      } else patrol(e, dt);
    } else { // gunner
      if (sees) {
        e.facing = sign(dx);
        if (dist < 110) e.vx = lerp(e.vx, -e.facing * 120, 1 - Math.pow(0.01, dt));
        else e.vx *= Math.pow(0.01, dt);
        e.fireCd -= dt;
        if (e.fireCd <= 0) {
          e.fireCd = rand(1.4, 2.1);
          const a = Math.atan2(dy - 6, dx) + rand(-0.06, 0.06);
          bullets.push({ x: e.x + e.facing * 18, y: e.y - 6, vx: Math.cos(a) * 560, vy: Math.sin(a) * 560, life: 2.2 });
          burst(e.x + e.facing * 20, e.y - 6, 4, '#ffd27a', 120, 0.15, 2, 0);
          AudioSys.shot();
        }
      } else patrol(e, dt);
    }
    // melee attack resolution
    if (e.atkT > 0) {
      e.atkT -= dt;
      if (!e.atkHit && e.atkT <= 0.2) {
        e.atkHit = true;
        if (Math.abs(p.x - e.x) < 46 && Math.abs(p.y - e.y) < 60 && p.alive) takeDamage(12, e.x);
      }
    }
    e.x += e.vx * dt; e.y += e.vy * dt;
    // stay on own rooftop
    const b = e.bld;
    if (e.x < b.x + 14) { e.x = b.x + 14; e.vx = Math.abs(e.vx) * 0.3; if (!sees) e.facing = 1; }
    if (e.x > b.x + b.w - 14) { e.x = b.x + b.w - 14; e.vx = -Math.abs(e.vx) * 0.3; if (!sees) e.facing = -1; }
    collideBody(e);
  }
}
function patrol(e, dt) {
  e.patrolT -= dt;
  if (e.patrolT <= 0) { e.patrolT = rand(1, 3.5); e.facing = Math.random() < 0.5 ? -1 : 1; e.idle = Math.random() < 0.4; }
  e.vx = lerp(e.vx, e.idle ? 0 : e.facing * 60, 1 - Math.pow(0.001, dt));
}

function updateBullets(dt) {
  const p = player;
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0 || b.y > GROUND_Y || insideBuilding(b.x, b.y)) { burst(b.x, b.y, 4, '#ffd27a', 100, 0.25, 1.5, 0); bullets.splice(i, 1); continue; }
    if (p.alive) {
      const rx = p.x - b.x, ry = p.y - b.y, d = Math.hypot(rx, ry);
      if (d < 170 && (rx * b.vx + ry * b.vy) > 0) { if (p.senseT <= 0) AudioSys.sense(); p.senseT = 0.25; }
      if (Math.abs(rx) < p.w / 2 + 3 && Math.abs(ry) < p.h / 2 + 3) {
        if (p.invulnT <= 0) takeDamage(9, b.x - b.vx);
        bullets.splice(i, 1);
      }
    }
  }
}

function updateCrimes(dt) {
  if (!G.crime) {
    G.crimeSpawnT -= dt;
    if (G.crimeSpawnT <= 0) spawnCrime();
    return;
  }
  G.crime.t += dt;
  if (G.crime.list.every(e => e.dead)) {
    G.crimes++; G.score += 500; G.crime = null; G.crimeSpawnT = 2.2;
    floatText(player.x, player.y - 80, 'CRIME STOPPED  +500', '#7dffa6', 22, 1.6);
    AudioSys.crime();
    if (G.crimes >= CRIMES_TO_WIN) {
      G.state = 'win'; AudioSys.win();
      try {
        if (G.score > G.best) { G.best = G.score; localStorage.setItem('mm_best', G.best); }
        if (!G.bestTime || G.time < G.bestTime) { G.bestTime = G.time; localStorage.setItem('mm_best_time', G.bestTime); }
      } catch (e) { }
    }
  }
}

function updateFx(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const q = particles[i]; q.life -= dt; if (q.life <= 0) { particles.splice(i, 1); continue; }
    q.vy += q.grav * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= Math.pow(0.2, dt);
  }
  for (let i = texts.length - 1; i >= 0; i--) { const t = texts[i]; t.life -= dt; t.y -= 40 * dt; if (t.life <= 0) texts.splice(i, 1); }
  for (let i = arcs.length - 1; i >= 0; i--) { arcs[i].life -= dt; if (arcs[i].life <= 0) arcs.splice(i, 1); }
  G.shake = Math.max(0, G.shake - 40 * dt);
  G.flash = Math.max(0, G.flash - dt);
  G.comboT -= dt; if (G.comboT <= 0) G.combo = 0;
  G.hintT -= dt;
}

function updateCamera(dt) {
  const p = player;
  const tx = p.x + clamp(p.vx * 0.3, -220, 220) - VW / 2;
  const ty = p.y + clamp(p.vy * 0.12, -120, 160) - VH * 0.58;
  const k = 1 - Math.pow(0.004, dt);
  cam.x = lerp(cam.x, tx, k); cam.y = lerp(cam.y, ty, k);
  cam.x = clamp(cam.x, 0, WORLD_W - VW);
  cam.y = clamp(cam.y, -1100, GROUND_Y + 140 - VH);
}

// ---------- Drawing helpers ----------
function limb(ox, oy, a1, l1, a2, l2) {
  const ex = ox + Math.sin(a1) * l1, ey = oy + Math.cos(a1) * l1;
  const hx = ex + Math.sin(a1 + a2) * l2, hy = ey + Math.cos(a1 + a2) * l2;
  ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ex, ey); ctx.lineTo(hx, hy); ctx.stroke();
  return [hx, hy];
}
function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }

function drawMiles(p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.scale(p.facing, 1);
  let alpha = 1;
  if (p.camo) alpha = 0.22 + 0.08 * Math.sin(p.animT * 20);
  if (p.invulnT > 0 && Math.floor(p.animT * 20) % 2 === 0) alpha *= 0.5;
  ctx.globalAlpha = alpha;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  const t = p.animT;
  let tilt = 0, arm1 = [0.15, 0.25], arm2 = [-0.15, 0.25], leg1 = [0.14, 0], leg2 = [-0.14, 0];
  let bob = 0;
  const speed = Math.abs(p.vx);
  if (!p.alive) { tilt = Math.PI / 2 * -p.facing; arm1 = [1.5, 0.3]; arm2 = [-1.2, 0.3]; leg1 = [0.5, -0.4]; leg2 = [-0.3, -0.3]; }
  else if (p.venomT > 0) { arm1 = [1.7, -0.2]; arm2 = [-1.7, 0.2]; leg1 = [0.6, 0]; leg2 = [-0.6, 0]; }
  else if (p.punchT > 0) { const k = p.punchT / 0.18; arm1 = [Math.PI / 2 + 0.1, -0.05]; arm2 = [-1.3, 1.4]; leg1 = [0.7, -0.2]; leg2 = [-0.6, -0.6]; tilt = 0.25 * (1 - k * 0.5); }
  else if (p.swinging) {
    const ax = (p.anchor.x - p.x) * p.facing, ay = p.anchor.y - p.y;
    const a = Math.atan2(ax, ay);
    tilt = (Math.PI - a) * 0.55;
    const aa = a + tilt;
    arm1 = [aa - 0.12, 0.05]; arm2 = [aa + 0.12, 0.05];
    const kick = Math.sin(t * 6) * 0.15;
    leg1 = [-0.55 + kick, -0.9]; leg2 = [-0.15 - kick, -1.0];
  }
  else if (p.onWall && !p.onGround) {
    const s = Math.abs(p.vy) > 10 ? Math.sin(t * 10) : 0;
    arm1 = [2.5 + s * 0.3, -0.6]; arm2 = [2.1 - s * 0.3, -0.5]; leg1 = [0.9 + s * 0.3, -0.9]; leg2 = [0.5 - s * 0.3, -0.7];
  }
  else if (!p.onGround) {
    if (p.vy < -100) { arm1 = [2.7, 0.3]; arm2 = [2.2, 0.5]; leg1 = [0.9, -1.6]; leg2 = [0.3, -1.3]; }
    else { arm1 = [2.3, -0.4]; arm2 = [-1.9, 0.5]; leg1 = [0.75, -0.3]; leg2 = [-0.5, -0.5]; tilt = clamp(p.vx / 2500, -0.3, 0.3); }
  }
  else if (speed > 30) {
    const s = Math.sin(t * (10 + Math.min(speed, 500) / 60));
    const amp = clamp(speed / 400, 0.3, 1);
    leg1 = [0.95 * s * amp, -1.1 * Math.max(0, -s) * amp]; leg2 = [-0.95 * s * amp, -1.1 * Math.max(0, s) * amp];
    arm1 = [-0.9 * s * amp, 1.2 * amp]; arm2 = [0.9 * s * amp, 1.2 * amp];
    tilt = 0.15 * amp; bob = Math.abs(s) * 2;
  } else { bob = Math.sin(t * 2) * 1.2; if (p.landT > 0) { leg1 = [0.5, -0.6]; leg2 = [-0.5, -0.6]; bob = 6; } }

  ctx.rotate(tilt);
  ctx.translate(0, bob);
  const BLACK = '#121218', RED = '#e0202a';

  // legs
  ctx.strokeStyle = BLACK; ctx.lineWidth = 8;
  limb(-3, 8, leg1[0], 15, leg1[1], 14);
  limb(3, 8, leg2[0], 15, leg2[1], 14);
  // torso
  ctx.lineWidth = 14; line(0, -12, 0, 8);
  // chest spider
  ctx.fillStyle = RED; circle(1, -5, 3);
  ctx.strokeStyle = RED; ctx.lineWidth = 1.5;
  for (const [sx, sy] of [[-6, -11], [6, -11], [-7, -4], [7, -4], [-6, 2], [6, 2]]) line(1, -5, sx, sy);
  // arms
  ctx.strokeStyle = BLACK; ctx.lineWidth = 7;
  const h1 = limb(0, -9, arm1[0], 13, arm1[1], 12);
  const h2 = limb(0, -9, arm2[0], 13, arm2[1], 12);
  ctx.fillStyle = RED; circle(h1[0], h1[1], 3.2); circle(h2[0], h2[1], 3.2);
  // head
  ctx.fillStyle = BLACK; circle(0, -23, 9.5);
  ctx.strokeStyle = RED; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(0, -23, 9.5, Math.PI, TAU); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, -23, 5.5, Math.PI * 1.1, TAU - 0.3); ctx.stroke();
  line(0, -32.5, 0, -23); line(-6.7, -29.7, 0, -23); line(6.7, -29.7, 0, -23);
  // eyes
  ctx.fillStyle = '#fff'; ctx.strokeStyle = RED; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.ellipse(4.5, -24, 4.6, 2.9, -0.35, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(-4.5, -24, 3.4, 2.3, 0.35, 0, TAU); ctx.fill(); ctx.stroke();

  // store world-space hand for the web line: local -> rotate -> flip -> translate
  const hx = h1[0], hy = h1[1] + bob;
  const rx = hx * Math.cos(tilt) - hy * Math.sin(tilt), ry = hx * Math.sin(tilt) + hy * Math.cos(tilt);
  p.hand = [p.x + rx * p.facing, p.y + ry];

  if (p.venomT > 0) {
    ctx.globalAlpha = 1; ctx.strokeStyle = '#ffe04a'; ctx.lineWidth = 2;
    for (let i = 0; i < 5; i++) { const a = Math.random() * TAU; const r = rand(20, 50); line(Math.cos(a) * 10, -10 + Math.sin(a) * 10, Math.cos(a) * r, -10 + Math.sin(a) * r); }
  }
  if (p.camo) {
    ctx.globalAlpha = 0.5; ctx.strokeStyle = '#9fe8ff'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(0, -5, 20 + Math.sin(t * 9) * 3, 34, 0, 0, TAU); ctx.stroke();
  }
  ctx.restore();

  // spider-sense
  if (p.senseT > 0 && p.alive) {
    ctx.save(); ctx.globalAlpha = p.senseT / 0.25;
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(p.x, p.y - 23, 16 + i * 7 + (0.25 - p.senseT) * 40, 0, TAU); ctx.stroke(); }
    ctx.restore();
  }
}

function drawEnemy(e) {
  ctx.save();
  ctx.translate(e.x, e.y);
  if (e.dead) { ctx.rotate(e.spin); ctx.globalAlpha = clamp(1 - (e.deadT - 1.5), 0, 1); }
  ctx.scale(e.facing, 1);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const moving = Math.abs(e.vx) > 15 && !e.dead && e.stunT <= 0;
  const s = moving ? Math.sin(e.animT * 11) : 0;
  const flashing = e.hurtT > 0;
  // legs
  ctx.strokeStyle = flashing ? '#fff' : '#2b2f4a'; ctx.lineWidth = 7;
  limb(-3, 8, s * 0.7, 14, -Math.max(0, -s) * 0.9, 12);
  limb(3, 8, -s * 0.7, 14, -Math.max(0, s) * 0.9, 12);
  // torso
  ctx.strokeStyle = flashing ? '#fff' : e.col; ctx.lineWidth = 13; line(0, -12, 0, 8);
  // arms
  ctx.lineWidth = 6;
  if (e.type === 'gunner' && !e.dead) {
    const h = limb(0, -8, 1.45, 11, 0.1, 10);
    limb(0, -8, 0.9, 11, 0.9, 9);
    ctx.fillStyle = '#111'; ctx.fillRect(h[0] - 2, h[1] - 4, 14, 5); ctx.fillRect(h[0] + 1, h[1] - 4, 4, 9);
  } else if (e.atkT > 0) {
    const k = clamp(1 - e.atkT / 0.5, 0, 1);
    limb(0, -8, -0.8 + k * 2.4, 11, k * 0.2, 10);
    limb(0, -8, -0.6, 11, 1.2, 9);
  } else {
    limb(0, -8, -s * 0.6 + 0.2, 11, 0.8, 10);
    limb(0, -8, s * 0.6 + 0.2, 11, 0.8, 10);
  }
  // head
  ctx.fillStyle = flashing ? '#fff' : e.skin; circle(0, -21, 8);
  ctx.fillStyle = flashing ? '#fff' : e.col;
  ctx.beginPath(); ctx.arc(0, -21, 9, Math.PI + 0.3, TAU - 0.3); ctx.lineTo(9, -18); ctx.lineTo(-9, -18); ctx.fill();
  ctx.fillStyle = '#111'; circle(3, -21, 1.2);
  ctx.restore();
  // stun stars / alert
  if (e.stunT > 0.1 && !e.dead) {
    ctx.save(); ctx.fillStyle = '#ffe04a'; ctx.font = 'bold 14px system-ui';
    for (let i = 0; i < 3; i++) { const a = e.animT * 6 + i * TAU / 3; ctx.fillText('✦', e.x + Math.cos(a) * 14 - 5, e.y - 36 + Math.sin(a) * 5); }
    ctx.restore();
  }
  if (e.alertT > 0 && !e.dead) {
    ctx.save(); ctx.fillStyle = '#ff5a5a'; ctx.font = 'bold 20px system-ui'; ctx.textAlign = 'center'; ctx.fillText('!', e.x, e.y - 42 - (0.8 - e.alertT) * 10); ctx.restore();
  }
  // hp pips
  if (!e.dead && e.alerted) {
    const max = e.type === 'gunner' ? 2 : 3;
    for (let i = 0; i < max; i++) { ctx.fillStyle = i < e.hp ? '#ff5a5a' : 'rgba(255,255,255,0.2)'; ctx.fillRect(e.x - max * 4 + i * 8, e.y - 38, 6, 3); }
  }
}

function drawWeb(p) {
  if (!p.swinging || !p.anchor) return;
  const a = p.anchor, h = p.hand;
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(h[0], h[1]);
  const n = 6, wob = Math.min(1, p.swingT * 6) * 3;
  for (let i = 1; i <= n; i++) {
    const t = i / n; const x = lerp(h[0], a.x, t), y = lerp(h[1], a.y, t);
    const off = Math.sin(t * Math.PI) * Math.sin(p.animT * 30 + i) * (3 - wob);
    ctx.lineTo(x + off, y + off);
  }
  ctx.stroke();
  ctx.fillStyle = '#fff'; circle(a.x, a.y, 3.5);
  ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1;
  for (let i = 0; i < 4; i++) { const ang = i * Math.PI / 4 + 0.3; line(a.x - Math.cos(ang) * 7, a.y - Math.sin(ang) * 7, a.x + Math.cos(ang) * 7, a.y + Math.sin(ang) * 7); }
  ctx.restore();
}

function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#05071a'); g.addColorStop(0.55, '#14122e'); g.addColorStop(1, '#2a1a3e');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // stars (slow parallax)
  ctx.fillStyle = '#fff';
  const sx = cam.x * 0.05, sy = cam.y * 0.08;
  for (const s of stars) {
    const x = ((s.x - sx) % 4000 + 4000) % 4000, y = s.y - sy + 200;
    if (x * VS > W || y < -10 || y * VS > H) continue;
    ctx.globalAlpha = 0.45 + 0.45 * Math.sin(G.time * 2 + s.tw);
    ctx.fillRect(x * VS, y * VS, s.s, s.s);
  }
  ctx.globalAlpha = 1;
  // moon
  const mx = (900 - cam.x * 0.03) * VS, my = (120 - cam.y * 0.05) * VS;
  const mg = ctx.createRadialGradient(mx, my, 20 * VS, mx, my, 160 * VS);
  mg.addColorStop(0, 'rgba(255,245,220,0.35)'); mg.addColorStop(1, 'rgba(255,245,220,0)');
  ctx.fillStyle = mg; ctx.fillRect(mx - 160 * VS, my - 160 * VS, 320 * VS, 320 * VS);
  ctx.fillStyle = '#fff4d6'; ctx.beginPath(); ctx.arc(mx, my, 34 * VS, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(200,190,170,0.35)';
  ctx.beginPath(); ctx.arc(mx - 10 * VS, my - 8 * VS, 7 * VS, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(mx + 12 * VS, my + 10 * VS, 5 * VS, 0, TAU); ctx.fill();
}

function drawBackLayers() {
  // Each layer scrolls at a fraction of the camera speed. The context is already in
  // world space, so shift the layer by cam*(1-f) to get an effective parallax of f.
  const cy0 = GROUND_Y + 140 - VH; // camera y when standing on the street
  for (const L of bgLayers) {
    const ox = cam.x * L.f;
    const horizon = GROUND_Y - cy0 * (1 - L.f);
    ctx.save();
    ctx.translate(cam.x * (1 - L.f), cam.y * (1 - L.f));
    ctx.fillStyle = L.color;
    for (const it of L.items) {
      if (it.x + it.w < ox - 10 || it.x > ox + VW + 10) continue;
      const top = horizon - it.h;
      ctx.fillRect(it.x, top, it.w, it.h + 1500);
      if (it.spire) { ctx.beginPath(); ctx.moveTo(it.x + it.w / 2 - 4, top); ctx.lineTo(it.x + it.w / 2, top - 50); ctx.lineTo(it.x + it.w / 2 + 4, top); ctx.fill(); }
      if (L.f > 0.3) {
        ctx.fillStyle = 'rgba(255,220,150,0.25)';
        for (let i = 0; i < it.dots.length; i += 2) ctx.fillRect(it.x + it.dots[i], top + it.dots[i + 1], 3, 4);
        ctx.fillStyle = L.color;
      }
    }
    ctx.restore();
  }
}

function drawBuildings() {
  for (const b of buildings) {
    if (b.x + b.w < cam.x - 10 || b.x > cam.x + VW + 10) continue;
    ctx.fillStyle = b.color; ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = 'rgba(0,0,0,0.28)'; ctx.fillRect(b.x + b.w - 12, b.y, 12, b.h);
    ctx.fillStyle = 'rgba(255,255,255,0.05)'; ctx.fillRect(b.x, b.y, 10, b.h);
    const y0 = cam.y - 30, y1 = cam.y + VH + 30;
    for (let k = 0; k < 3; k++) {
      ctx.fillStyle = WIN_COLORS[k];
      const arr = b.wins[k];
      for (let i = 0; i < arr.length; i += 2) {
        const wy = b.y + 20 + arr[i + 1] * 26;
        if (wy < y0 || wy > y1) continue;
        ctx.fillRect(b.x + 12 + arr[i] * 22, wy, 11, 15);
      }
    }
    ctx.fillStyle = 'rgba(255,255,255,0.16)'; ctx.fillRect(b.x, b.y, b.w, 4);
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(b.x, b.y + 4, b.w, 3);
    if (b.tower) {
      const tx = b.x + b.w * 0.72, ty = b.y;
      ctx.fillStyle = '#2d2a3c'; ctx.fillRect(tx - 14, ty - 44, 28, 30);
      ctx.fillStyle = '#3a3650'; ctx.beginPath(); ctx.moveTo(tx - 16, ty - 44); ctx.lineTo(tx, ty - 56); ctx.lineTo(tx + 16, ty - 44); ctx.fill();
      ctx.strokeStyle = '#2d2a3c'; ctx.lineWidth = 3; line(tx - 10, ty - 14, tx - 12, ty); line(tx + 10, ty - 14, tx + 12, ty);
    }
    if (b.antenna) {
      const ax = b.x + 24;
      ctx.strokeStyle = '#3a3650'; ctx.lineWidth = 2; line(ax, b.y, ax, b.y - 60);
      ctx.fillStyle = Math.sin(G.time * 4 + b.x) > 0 ? '#ff2a2a' : '#5a1010'; circle(ax, b.y - 62, 3);
    }
    if (b.sign) {
      ctx.save(); ctx.font = 'bold 22px system-ui, sans-serif'; ctx.textAlign = 'center';
      const sx = b.x + b.w / 2, sy = b.y + b.sign.y;
      ctx.fillStyle = b.sign.color; ctx.globalAlpha = 0.25; ctx.fillRect(sx - 60, sy - 22, 120, 32);
      ctx.globalAlpha = 1; ctx.fillText(b.sign.text, sx, sy);
      ctx.restore();
    }
  }
}

function drawStreet() {
  const x0 = cam.x - 20, x1 = cam.x + VW + 20;
  ctx.fillStyle = '#0c0e1a'; ctx.fillRect(x0, GROUND_Y, x1 - x0, VH + 400);
  ctx.fillStyle = '#1b1e2e'; ctx.fillRect(x0, GROUND_Y, x1 - x0, 12);
  ctx.fillStyle = '#2a2d40'; ctx.fillRect(x0, GROUND_Y, x1 - x0, 3);
  ctx.fillStyle = '#d6b53a';
  for (let x = Math.floor(x0 / 80) * 80; x < x1; x += 80) ctx.fillRect(x, GROUND_Y + 70, 40, 4);
  // lamps
  for (let x = Math.floor(x0 / 340) * 340 + 100; x < x1; x += 340) {
    ctx.strokeStyle = '#3a3d55'; ctx.lineWidth = 4; line(x, GROUND_Y, x, GROUND_Y - 90); line(x, GROUND_Y - 90, x + 22, GROUND_Y - 96);
    const g = ctx.createRadialGradient(x + 24, GROUND_Y - 92, 2, x + 24, GROUND_Y - 92, 90);
    g.addColorStop(0, 'rgba(255,220,150,0.45)'); g.addColorStop(1, 'rgba(255,220,150,0)');
    ctx.fillStyle = g; ctx.fillRect(x - 70, GROUND_Y - 180, 190, 190);
    ctx.fillStyle = '#ffe9b0'; circle(x + 24, GROUND_Y - 94, 4);
  }
}

function drawFx() {
  for (const q of particles) {
    ctx.globalAlpha = clamp(q.life / q.maxLife, 0, 1); ctx.fillStyle = q.color;
    ctx.fillRect(q.x - q.size / 2, q.y - q.size / 2, q.size, q.size);
  }
  ctx.globalAlpha = 1;
  for (const a of arcs) {
    ctx.save(); ctx.globalAlpha = a.life / a.maxLife; ctx.strokeStyle = '#ffe04a'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(a.x1, a.y1);
    const n = 7;
    for (let i = 1; i < n; i++) { const t = i / n; ctx.lineTo(lerp(a.x1, a.x2, t) + rand(-12, 12), lerp(a.y1, a.y2, t) + rand(-12, 12)); }
    ctx.lineTo(a.x2, a.y2); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.restore();
  }
  ctx.textAlign = 'center';
  for (const t of texts) {
    ctx.globalAlpha = clamp(t.life / t.maxLife * 1.5, 0, 1);
    ctx.font = `bold ${t.size}px system-ui, sans-serif`;
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillText(t.txt, t.x + 1.5, t.y + 1.5);
    ctx.fillStyle = t.color; ctx.fillText(t.txt, t.x, t.y);
  }
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
}

function drawBullets() {
  ctx.strokeStyle = '#ffd27a'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  for (const b of bullets) line(b.x, b.y, b.x - b.vx * 0.02, b.y - b.vy * 0.02);
}

function drawCrimeMarker() {
  if (!G.crime) return;
  const b = G.crime.b, x = b.x + b.w / 2, y = b.y - 70 + Math.sin(G.time * 4) * 6;
  ctx.save();
  ctx.fillStyle = 'rgba(255,60,80,0.9)';
  ctx.beginPath(); ctx.moveTo(x, y + 18); ctx.lineTo(x - 14, y - 6); ctx.lineTo(x + 14, y - 6); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 16px system-ui'; ctx.textAlign = 'center'; ctx.fillText('!', x, y + 2);
  // ground beam
  const g = ctx.createLinearGradient(0, b.y - 200, 0, b.y);
  g.addColorStop(0, 'rgba(255,60,80,0)'); g.addColorStop(1, 'rgba(255,60,80,0.18)');
  ctx.fillStyle = g; ctx.fillRect(b.x, b.y - 200, b.w, 200);
  ctx.restore();
}

function drawSpeedLines(p) {
  const sp = Math.hypot(p.vx, p.vy);
  if (sp < 720) return;
  ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1.5;
  const nx = p.vx / sp, ny = p.vy / sp, k = clamp((sp - 720) / 500, 0, 1);
  for (let i = 0; i < 10 * k; i++) {
    const ox = rand(-220, 220), oy = rand(-160, 160);
    const px = p.x - nx * 40 + ox - ny * oy * 0.6, py = p.y - ny * 40 + oy + nx * oy * 0.6;
    line(px, py, px - nx * rand(40, 110), py - ny * rand(40, 110));
  }
  ctx.restore();
}

// ---------- HUD ----------
function bar(x, y, w, h, f, color, label) {
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
  ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color; ctx.fillRect(x, y, w * clamp(f, 0, 1), h);
  if (label) { ctx.fillStyle = '#fff'; ctx.font = 'bold 11px system-ui, sans-serif'; ctx.textAlign = 'left'; ctx.fillText(label, x + 6, y + h - 3); }
}
function fmtTime(t) { const m = Math.floor(t / 60), s = Math.floor(t % 60); return m + ':' + (s < 10 ? '0' : '') + s; }

function drawHUD() {
  const p = player;
  ctx.save();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.textBaseline = 'alphabetic';
  // left: bars
  bar(20, 20, 230, 18, p.hp / p.maxHp, p.hp < 30 ? '#ff2a3a' : '#e0202a', 'HEALTH');
  bar(20, 46, 230, 12, p.venom / 100, p.venom >= 50 ? '#ffd23f' : '#8a7a2a', 'VENOM' + (p.venom >= 50 ? '  (K) READY' : ''));
  // camo ring
  const cx = 36, cy = 86;
  ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 7; ctx.beginPath(); ctx.arc(cx, cy, 13, 0, TAU); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(cx, cy, 13, 0, TAU); ctx.stroke();
  let frac = 1, col = '#9fe8ff';
  if (p.camo) frac = p.camoT / 6; else if (p.camoCd > 0) { frac = 1 - p.camoCd / 12; col = '#4a6a78'; }
  ctx.strokeStyle = col; ctx.beginPath(); ctx.arc(cx, cy, 13, -Math.PI / 2, -Math.PI / 2 + TAU * frac); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 11px system-ui, sans-serif'; ctx.textAlign = 'left';
  ctx.fillText(p.camo ? 'CAMO ACTIVE' : p.camoCd > 0 ? 'CAMO ' + Math.ceil(p.camoCd) + 's' : 'CAMO (L) READY', 58, cy + 4);

  // center: objective
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(W / 2 - 150, 14, 300, 54);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 15px system-ui, sans-serif';
  ctx.fillText(`CRIMES STOPPED  ${G.crimes} / ${CRIMES_TO_WIN}`, W / 2, 36);
  ctx.font = '13px system-ui, sans-serif'; ctx.fillStyle = '#cfd6ff';
  if (G.crime) {
    const d = (G.crime.b.x + G.crime.b.w / 2 - p.x);
    ctx.fillStyle = '#ff7a86';
    ctx.fillText((d > 0 ? '→ ' : '← ') + 'Crime in progress  ' + Math.round(Math.abs(d) / 10) + 'm', W / 2, 57);
  } else ctx.fillText('Scanning for trouble...', W / 2, 57);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 13px system-ui, sans-serif';
  ctx.fillText(fmtTime(G.time), W / 2, 86);

  // right: score
  ctx.textAlign = 'right';
  ctx.font = 'bold 22px system-ui, sans-serif'; ctx.fillStyle = '#fff';
  ctx.fillText(G.score.toLocaleString(), W - 20, 40);
  ctx.font = '12px system-ui, sans-serif'; ctx.fillStyle = '#cfd6ff'; ctx.fillText('SCORE', W - 20, 56);
  if (G.combo > 1) { ctx.fillStyle = '#ffd23f'; ctx.font = `bold ${16 + Math.min(G.combo, 10) * 1.5}px system-ui, sans-serif`; ctx.fillText(G.combo + 'x COMBO', W - 20, 90); }

  // off-screen crime arrow
  if (G.crime) {
    const wx = (G.crime.b.x + G.crime.b.w / 2 - cam.x) * VS, wy = (G.crime.b.y - 60 - cam.y) * VS;
    if (wx < 0 || wx > W || wy < 0 || wy > H) {
      const ex = clamp(wx, 40, W - 40), ey = clamp(wy, 110, H - 40);
      const ang = Math.atan2(wy - ey, wx - ex);
      ctx.save(); ctx.translate(ex, ey); ctx.rotate(ang);
      ctx.fillStyle = 'rgba(255,60,80,0.95)'; ctx.beginPath(); ctx.moveTo(18, 0); ctx.lineTo(-10, -12); ctx.lineTo(-4, 0); ctx.lineTo(-10, 12); ctx.fill();
      ctx.restore();
    }
  }

  // hints
  if (G.hintT > 0 && G.state === 'play' && !touch.ui) {
    ctx.globalAlpha = clamp(G.hintT, 0, 1);
    ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(W / 2 - 330, H - 60, 660, 40);
    ctx.fillStyle = '#fff'; ctx.font = '13px system-ui, sans-serif';
    ctx.fillText('A/D move  ·  W jump (double jump)  ·  hold SPACE / click to web-swing (aim with mouse)  ·  J punch  ·  K venom strike  ·  L camouflage', W / 2, H - 35);
    ctx.globalAlpha = 1;
  }
  if (touch.ui && G.state === 'play') drawTouchUI();
  ctx.restore();
}

function drawTouchUI() {
  const p = player;
  // floating stick
  const s = touch.stick;
  if (s) {
    const dx = s.x - s.ox, dy = s.y - s.oy, d = Math.hypot(dx, dy), k = d > 44 ? 44 / d : 1;
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(s.ox, s.oy, 48, 0, TAU); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.beginPath(); ctx.arc(s.ox + dx * k, s.oy + dy * k, 24, 0, TAU); ctx.fill();
  } else {
    ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 2; ctx.setLineDash([6, 8]);
    ctx.beginPath(); ctx.arc(W * 0.14, H - Math.min(H * 0.22, 150), 48, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.font = 'bold 11px system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('MOVE', W * 0.14, H - Math.min(H * 0.22, 150) + 4);
  }
  // web aim marker
  if (touch.web && p.swinging && p.anchor) { /* the web line itself shows the aim */ }
  // buttons
  for (const b of touch.btns) {
    let ready = true, label = b.label;
    if (b.key === 'KeyK') { ready = p.venom >= 50; }
    if (b.key === 'KeyL') { ready = !p.camo && p.camoCd <= 0; if (p.camoCd > 0) label = Math.ceil(p.camoCd) + 's'; if (p.camo) label = 'ON'; }
    ctx.globalAlpha = b.held ? 0.85 : ready ? 0.45 : 0.2;
    ctx.fillStyle = b.color; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.globalAlpha = b.held ? 1 : 0.8;
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = `bold ${Math.round(b.r * 0.34)}px system-ui, sans-serif`; ctx.textAlign = 'center'; ctx.fillText(label, b.x, b.y + b.r * 0.12);
    ctx.globalAlpha = 1;
  }
  if (touch.hintT > 0) {
    touch.hintT -= 1 / 60;
    ctx.globalAlpha = clamp(touch.hintT, 0, 1);
    ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(W / 2 - 200, 100, 400, 50);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 14px system-ui, sans-serif';
    ctx.fillText('Touch and HOLD the sky to web-swing toward your finger', W / 2, 121);
    ctx.font = '13px system-ui, sans-serif'; ctx.fillText('Drag on the left to move  ·  push into walls to climb', W / 2, 141);
    ctx.globalAlpha = 1;
  }
}

function overlay(title, sub, lines, color = '#e0202a') {
  ctx.save(); ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = 'rgba(3,4,12,0.72)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  const cy = H * 0.36;
  ctx.font = `900 ${Math.min(72, W / 12)}px system-ui, sans-serif`;
  ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillText(title, W / 2 + 4, cy + 4);
  ctx.fillStyle = color; ctx.fillText(title, W / 2, cy);
  ctx.font = `bold ${Math.min(26, W / 30)}px system-ui, sans-serif`; ctx.fillStyle = '#fff';
  ctx.fillText(sub, W / 2, cy + 44);
  ctx.font = `15px system-ui, sans-serif`; ctx.fillStyle = '#cfd6ff';
  lines.forEach((l, i) => ctx.fillText(l, W / 2, cy + 90 + i * 24));
  ctx.restore();
}

// ---------- Main loop ----------
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 1 / 30) dt = 1 / 30;

  applyTouchInput();
  // state transitions
  if (G.state === 'title') { if (wasPressed('Enter', 'Mouse', 'Space')) { AudioSys.ensure(); reset(); G.state = 'play'; } }
  else if (G.state === 'play') {
    if (wasPressed('KeyP', 'Escape')) G.paused = !G.paused;
    if (!G.paused) {
      G.time += dt;
      updatePlayer(dt); updateEnemies(dt); updateBullets(dt); updateCrimes(dt); updateFx(dt);
    }
  } else if (G.state === 'win' || G.state === 'dead') {
    updateFx(dt);
    if (wasPressed('Enter', 'KeyR', 'Mouse')) { reset(); G.state = 'play'; }
  }
  if (G.state !== 'play' || !G.paused) updateCamera(dt);
  if (G.state === 'title' && player.animT === 0) reset();
  if (G.state === 'title') { player.animT += dt; updateFx(dt); }

  // ---- render ----
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawSky();
  const shx = G.shake ? rand(-G.shake, G.shake) : 0, shy = G.shake ? rand(-G.shake, G.shake) : 0;
  ctx.setTransform(DPR * VS, 0, 0, DPR * VS, 0, 0);
  ctx.translate(-cam.x + shx, -cam.y + shy);
  drawBackLayers();
  drawBuildings();
  drawStreet();
  drawCrimeMarker();
  for (const e of enemies) drawEnemy(e);
  drawBullets();
  drawSpeedLines(player);
  drawWeb(player);
  drawMiles(player);
  drawFx();

  // vignette + flash
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.4, W / 2, H / 2, H * 0.95);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  if (G.flash > 0) { ctx.fillStyle = `rgba(255,224,74,${G.flash * 0.6})`; ctx.fillRect(0, 0, W, H); }
  if (player.hp < 30 && player.alive && G.state === 'play') { ctx.fillStyle = `rgba(255,0,30,${0.08 + 0.08 * Math.sin(G.time * 6)})`; ctx.fillRect(0, 0, W, H); }

  if (G.state === 'play') drawHUD();
  if (G.state === 'play' && G.paused) overlay('PAUSED', 'Press P or Esc to resume', []);
  if (G.state === 'title' && touch.ui) overlay('MILES MORALES', 'BROOKLYN NIGHTS', [
    'Tap to start',
    '',
    'Drag on the left side of the screen to move, push into walls to climb',
    'Touch and hold the sky to web-swing toward your finger, let go to release',
    'JUMP also launches you off a web (double jump in the air)',
    'PUNCH thugs  ·  VENOM shocks everyone around you  ·  CAMO for stealth takedowns',
    '',
    `Stop ${CRIMES_TO_WIN} rooftop crimes as fast as you can. Landscape works best.` + (G.best ? `   Best: ${G.best.toLocaleString()} pts in ${fmtTime(G.bestTime)}` : ''),
    'Fan-made, non-commercial tribute. Not affiliated with Marvel or Sony.',
  ]);
  else if (G.state === 'title') overlay('MILES MORALES', 'BROOKLYN NIGHTS', [
    'Press ENTER or click to start',
    '',
    'A / D  move     W  jump (double jump, launch off webs)',
    'Hold SPACE or LEFT CLICK  web-swing  (aim with the mouse, W/S to shorten/lengthen the web)',
    'Hold toward a wall  wall-crawl     J / RIGHT CLICK  punch',
    'K  Venom Strike (builds by landing hits)     L / SHIFT  Camouflage (stealth takedowns)',
    '',
    `Stop ${CRIMES_TO_WIN} rooftop crimes as fast as you can.` + (G.best ? `   Best: ${G.best.toLocaleString()} pts in ${fmtTime(G.bestTime)}` : ''),
    'Fan-made, non-commercial tribute. Not affiliated with Marvel or Sony.',
  ]);
  if (G.state === 'win') overlay('BROOKLYN IS SAFE', `${G.score.toLocaleString()} pts  ·  ${fmtTime(G.time)}`, [touch.ui ? 'Tap to swing again' : 'Press ENTER to swing again', G.best ? `Best: ${G.best.toLocaleString()} pts in ${fmtTime(G.bestTime)}` : ''], '#7dffa6');
  if (G.state === 'dead') overlay('KNOCKED OUT', `${G.score.toLocaleString()} pts  ·  ${G.crimes} crimes stopped`, [touch.ui ? 'Tap to get back up' : 'Press ENTER or R to get back up', 'Tip: keep moving. Swing in, punch, swing out. Venom Strike clears a crowd.']);

  for (const k in pressed) pressed[k] = false;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
